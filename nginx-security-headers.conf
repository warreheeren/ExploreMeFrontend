# Beveiligingsheaders, ge-include in elk location-blok (nginx erft add_header niet zodra een blok er zelf één zet).
# De Content-Security-Policy zelf staat als <meta> in index.html (zie vite.config.js); frame-ancestors kan alleen als header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
# Alleen zinvol achter HTTPS (de browser negeert HSTS over http).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
